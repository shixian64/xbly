name: bbw

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  TZ: ${TZ:-Asia/Shanghai}
  BBW_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-bbw}
  POSTGRES_USER: ${POSTGRES_USER:-bbw}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  BBW_REDIS_URL: redis://redis:6379/0
  BBW_REDIS_PREFIX: ${BBW_REDIS_PREFIX:-bbw}
  BBW_CREDENTIAL_MASTER_KEY_FILE: /run/secrets/app_master_key
  BBW_CREDENTIAL_KEYS_FILE: /run/secrets/credential_keyring
  BBW_CREDENTIAL_KEY_VERSION: ${BBW_CREDENTIAL_KEY_VERSION:-1}
  BBW_PHONE_HMAC_KEY_FILE: /run/secrets/phone_hmac_key
  BBW_SESSION_HMAC_KEY_FILE: /run/secrets/session_hmac_key
  BBW_TXIM_SECRET_KEY_FILE: /run/secrets/txim_secret_key
  BBW_ROOMKIT_BUSINESS_TOKEN_FILE: /run/secrets/roomkit_business_token
  BBW_SQL_ECHO: "false"
  BBW_DB_POOL_SIZE: "5"
  BBW_DB_MAX_OVERFLOW: "2"
  BBW_WEB_SESSION_IDLE_SECONDS: "604800"
  BBW_WEB_SESSION_ABSOLUTE_SECONDS: "2592000"
  BBW_ADMIN_SESSION_IDLE_SECONDS: "1800"
  BBW_ADMIN_SESSION_ABSOLUTE_SECONDS: "28800"
  BBW_ADMIN_UNLOCK_SECONDS: "900"
  BBW_AUDIT_RETENTION_DAYS: "180"
  BBW_CHAT_RETENTION_DAYS: "180"
  BBW_RAW_RESPONSE_RETENTION_DAYS: "7"
  BBW_USER_MEDIA_QUOTA_BYTES: "104857600"
  BBW_SYSTEM_MEDIA_QUOTA_BYTES: "8589934592"
  BBW_USER_COOKIE_NAME: __Host-bbw_sid
  BBW_ADMIN_COOKIE_NAME: __Host-bbw_admin_sid
  BBW_COOKIE_SECURE: "true"
  BBW_TRUST_PROXY_HEADERS: "true"
  BBW_MAX_JSON_BODY_BYTES: "262144"
  BBW_MAX_REQUEST_BODY_BYTES: "62914560"
  BBW_R2_ENDPOINT: https://${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID}.r2.cloudflarestorage.com
  BBW_R2_ACCESS_KEY_FILE: /run/secrets/r2_access_key_id
  BBW_R2_SECRET_KEY_FILE: /run/secrets/r2_secret_access_key
  BBW_R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET}
  BBW_R2_REGION: auto
  BBW_RQ_QUEUES: critical,agent-control,agent,default,media,sync,transcode-v2,transcode
  BBW_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  BBW_TURNSTILE_SECRET_KEY_FILE: /run/secrets/turnstile_secret_key
  BBW_INVITE_REQUIRED: "true"
  BBW_UPSTREAM_AUTH_MODE: "${BBW_UPSTREAM_AUTH_MODE:-provider-only}"
  BBW_COMPATIBILITY_MODE: "${BBW_COMPATIBILITY_MODE:-enabled}"
  BBW_UPSTREAM_AUTH_TIMEOUT_SECONDS: "${BBW_UPSTREAM_AUTH_TIMEOUT_SECONDS:-5}"
  BBW_LOCAL_PASSWORD_AUTH_CONCURRENCY: "${BBW_LOCAL_PASSWORD_AUTH_CONCURRENCY:-2}"
  BBW_IM_INTERACTIVE_BUDGET_SECONDS: "${BBW_IM_INTERACTIVE_BUDGET_SECONDS:-6}"
  BBW_TIM_INTERACTIVE_TIMEOUT_SECONDS: "${BBW_TIM_INTERACTIVE_TIMEOUT_SECONDS:-3}"
  BBW_PROVIDER_INTERACTIVE_TIMEOUT_SECONDS: "${BBW_PROVIDER_INTERACTIVE_TIMEOUT_SECONDS:-3}"
  BBW_PROFILE_INTERACTIVE_BUDGET_SECONDS: "${BBW_PROFILE_INTERACTIVE_BUDGET_SECONDS:-5}"
  BBW_PROFILE_INTERACTIVE_TIMEOUT_SECONDS: "${BBW_PROFILE_INTERACTIVE_TIMEOUT_SECONDS:-3}"
  BBW_PROFILE_SYNC_FETCH_LIMIT: "${BBW_PROFILE_SYNC_FETCH_LIMIT:-12}"
  BBW_PROFILE_LOOKUP_WORKERS: "${BBW_PROFILE_LOOKUP_WORKERS:-8}"
  BBW_PROFILE_LOOKUP_PENDING: "${BBW_PROFILE_LOOKUP_PENDING:-32}"
  BBW_PRESENCE_INTERACTIVE_TIMEOUT_SECONDS: "${BBW_PRESENCE_INTERACTIVE_TIMEOUT_SECONDS:-3}"
  BBW_PRESENCE_WORKERS: "${BBW_PRESENCE_WORKERS:-4}"
  BBW_DEPENDENCY_BREAKER_FAILURE_THRESHOLD: "${BBW_DEPENDENCY_BREAKER_FAILURE_THRESHOLD:-3}"
  BBW_DEPENDENCY_BREAKER_WINDOW_SECONDS: "${BBW_DEPENDENCY_BREAKER_WINDOW_SECONDS:-10}"
  BBW_DEPENDENCY_BREAKER_COOLDOWN_SECONDS: "${BBW_DEPENDENCY_BREAKER_COOLDOWN_SECONDS:-20}"
  BBW_ACTIVE_SYNC_SECONDS: "300"
  BBW_INACTIVE_SYNC_SECONDS: "3600"
  BBW_MEDIA_STRIP_METADATA: "true"
  BBW_MEDIA_MAX_IMAGE_BYTES: "20971520"
  BBW_MEDIA_MAX_AUDIO_BYTES: "20971520"
  BBW_MEDIA_MAX_VIDEO_BYTES: "104857600"
  BBW_MOMENT_VIDEO_MAX_SOURCE_BYTES: "157286400"
  BBW_MEDIA_MAX_ATTACHMENT_BYTES: "41943040"
  BBW_MEDIA_ALLOWED_HOSTS: "${MEDIA_ALLOWED_HOSTS:-oss.banghua.xin,*.myqcloud.com,*.qcloud.com}"
  BBW_R2_PRESIGN_TTL_SECONDS: "300"
  BBW_AI_BYOK_ALLOWED_HOSTS: "${AI_BYOK_ALLOWED_HOSTS:-}"
  BBW_AI_BYOK_CONNECT_TIMEOUT_SECONDS: "${AI_BYOK_CONNECT_TIMEOUT_SECONDS:-10}"
  BBW_AI_BYOK_READ_TIMEOUT_SECONDS: "${AI_BYOK_READ_TIMEOUT_SECONDS:-60}"
  BBW_AI_BYOK_MAX_RESPONSE_BYTES: "${AI_BYOK_MAX_RESPONSE_BYTES:-1048576}"
  BBW_AI_AGENT_BACKGROUND_ENABLED: "${AI_AGENT_BACKGROUND_ENABLED:-false}"
  BBW_AI_AGENT_DISPATCH_BATCH_SIZE: "${AI_AGENT_DISPATCH_BATCH_SIZE:-10}"
  BBW_AI_AGENT_FAILURE_BACKOFF_SECONDS: "${AI_AGENT_FAILURE_BACKOFF_SECONDS:-300}"
  BBW_MOMENT_VIDEO_CACHE_RETENTION_DAYS: "30"
  BBW_MOMENT_VIDEO_CACHE_MAX_BYTES: "2147483648"
  BBW_MOMENT_VIDEO_CACHE_MAX_OBJECTS: "2000"
  NO_PROXY: postgres,redis,app,localhost,127.0.0.1

x-worker-secrets: &worker-secrets
  - postgres_password
  - app_master_key
  - credential_keyring
  - txim_secret_key
  - r2_access_key_id
  - r2_secret_access_key

x-agent-worker-secrets: &agent-worker-secrets
  - postgres_password
  - app_master_key
  - credential_keyring
  - phone_hmac_key
  - session_hmac_key
  - txim_secret_key
  - r2_access_key_id
  - r2_secret_access_key

x-transcode-secrets: &transcode-secrets
  - r2_access_key_id
  - r2_secret_access_key

x-app-security: &app-security
  user: "10001:10001"
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  pids_limit: 128
  ulimits:
    nofile:
      soft: 4096
      hard: 8192

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-bbw}
      POSTGRES_USER: ${POSTGRES_USER:-bbw}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --locale=C
    secrets:
      - postgres_password
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - wal_buffers=4MB
      - -c
      - min_wal_size=80MB
      - -c
      - max_wal_size=512MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=100
      - -c
      - autovacuum_max_workers=2
      - -c
      - jit=off
      - -c
      - huge_pages=off
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - statement_timeout=60000
      - -c
      - log_min_duration_statement=2000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=3775
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1536m
    mem_reservation: 768m
    cpus: 1.50
    pids_limit: 128
    shm_size: 64m
    stop_grace_period: 45s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    user: redis
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks:
      - queue
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 384m
    mem_reservation: 128m
    cpus: 0.50
    pids_limit: 64
    stop_grace_period: 30s
    logging: *default-logging

  migrate:
    image: ${APP_IMAGE:-bbw-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BBW_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bbw}
      POSTGRES_USER: ${POSTGRES_USER:-bbw}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - database
    restart: "no"
    mem_limit: 256m
    cpus: 0.30
    pids_limit: 64
    logging: *default-logging

  app:
    image: ${APP_IMAGE:-bbw-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *app-security
    environment:
      <<: *app-environment
      BBW_ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      BBW_ADMIN_INITIAL_PASSWORD_FILE: /run/secrets/admin_initial_password
      BBW_DEPLOYMENT_CONTROL_TOKEN_FILE: /run/secrets/deployment_control_token
    secrets:
      - postgres_password
      - app_master_key
      - credential_keyring
      - phone_hmac_key
      - session_hmac_key
      - txim_secret_key
      - roomkit_business_token
      - r2_access_key_id
      - r2_secret_access_key
      - turnstile_secret_key
      - admin_initial_password
      - deployment_control_token
    command:
      - uvicorn
      - bbw_web.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --limit-concurrency
      - "64"
      - --backlog
      - "128"
      - --timeout-keep-alive
      - "10"
      - --timeout-graceful-shutdown
      - "25"
      - --no-access-log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - public
      - database
      - queue
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 1.50
    stop_grace_period: 30s
    logging: *default-logging

  worker:
    image: ${APP_IMAGE:-bbw-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *app-security
    environment:
      <<: *app-environment
      BBW_RQ_QUEUES: critical,default,media
      BBW_PHONE_HMAC_KEY_FILE: ""
      BBW_SESSION_HMAC_KEY_FILE: ""
      BBW_ROOMKIT_BUSINESS_TOKEN_FILE: ""
      BBW_TURNSTILE_SITE_KEY: ""
      BBW_TURNSTILE_SECRET_KEY_FILE: ""
    secrets: *worker-secrets
    command: ["python", "-m", "bbw_web.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - queue
      - egress
    mem_limit: 1024m
    mem_reservation: 384m
    cpus: 1.50
    stop_grace_period: 60s
    logging: *default-logging

  im-ingest-worker:
    image: ${APP_IMAGE:-bbw-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *app-security
    environment:
      <<: *app-environment
      BBW_RQ_QUEUES: im-ingest
      BBW_PHONE_HMAC_KEY_FILE: ""
      BBW_SESSION_HMAC_KEY_FILE: ""
      BBW_ROOMKIT_BUSINESS_TOKEN_FILE: ""
      BBW_TURNSTILE_SITE_KEY: ""
      BBW_TURNSTILE_SECRET_KEY_FILE: ""
    secrets: *worker-secrets
    command: ["python", "-m", "bbw_web.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - queue
    mem_limit: 512m
    mem_reservation: 192m
    cpus: 1.00
    stop_grace_period: 60s
    logging: *default-logging

  sync-worker:
    image: ${APP_IMAGE:-bbw-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *app-security
    environment:
      <<: *app-environment
      BBW_RQ_QUEUES: sync
      BBW_PHONE_HMAC_KEY_FILE: ""
      BBW_SESSION_HMAC_KEY_FILE: ""
      BBW_ROOMKIT_BUSINESS_TOKEN_FILE: ""
      BBW_TURNSTILE_SITE_KEY: ""
      BBW_TURNSTILE_SECRET_KEY_FILE: ""
    secrets: *worker-secrets
    command: ["python", "-m", "bbw_web.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - queue
      - egress
    mem_limit: 768m
    mem_reservation: 320m
    cpus: 1.25
    stop_grace_period: 60s
    logging: *default-logging

  agent-worker:
    image: ${APP_IMAGE:-bbw-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *app-security
    environment:
      <<: *app-environment
      BBW_RQ_QUEUES: agent-control,agent
      BBW_ROOMKIT_BUSINESS_TOKEN_FILE: ""
      BBW_TURNSTILE_SITE_KEY: ""
      BBW_TURNSTILE_SECRET_KEY_FILE: ""
    secrets: *agent-worker-secrets
    command: ["python", "-m", "bbw_web.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - queue
      - egress
    mem_limit: 768m
    mem_reservation: 320m
    cpus: 1.25
    # The RQ timeout for one model generation plus its guarded action is 300s.
    stop_grace_period: 6m
    logging: *default-logging

  transcode-worker:
    image: ${APP_IMAGE:-bbw-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *app-security
    environment:
      <<: *app-environment
      BBW_RQ_QUEUES: transcode-v2,transcode
      BBW_RQ_WITH_SCHEDULER: "true"
      BBW_SKIP_DATABASE_CONFIG: "true"
      BBW_DATABASE_URL: postgresql+psycopg://disabled:disabled@127.0.0.1:1/disabled
      POSTGRES_PASSWORD_FILE: ""
      BBW_CREDENTIAL_MASTER_KEY_FILE: ""
      BBW_CREDENTIAL_KEYS_FILE: ""
      BBW_PHONE_HMAC_KEY_FILE: ""
      BBW_SESSION_HMAC_KEY_FILE: ""
      BBW_TXIM_SECRET_KEY_FILE: ""
      BBW_ROOMKIT_BUSINESS_TOKEN_FILE: ""
      BBW_TURNSTILE_SITE_KEY: ""
      BBW_TURNSTILE_SECRET_KEY_FILE: ""
      BBW_MOMENT_VIDEO_JOB_TIMEOUT_SECONDS: "1500"
      BBW_MOMENT_VIDEO_MAX_SOURCE_BYTES: "157286400"
      BBW_MOMENT_VIDEO_MAX_DURATION_SECONDS: "600"
      BBW_MOMENT_VIDEO_MAX_SOURCE_DIMENSION: "4096"
      BBW_MOMENT_VIDEO_MAX_SOURCE_PIXELS: "9000000"
      BBW_MOMENT_VIDEO_MAX_SOURCE_FPS: "120"
      BBW_MOMENT_VIDEO_MAX_OUTPUT_BYTES: "104857600"
      BBW_MOMENT_VIDEO_THREADS: "1"
      TMPDIR: /var/tmp/bbw-transcode
    secrets: *transcode-secrets
    command: ["python", "-m", "bbw_web.worker"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - queue
      - egress
    volumes:
      - ${BBW_DATA_ROOT:-/var/lib/bbw}/transcode:/var/tmp/bbw-transcode
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: 1.25
    pids_limit: 128
    # RQ may run one transcode for up to 1800 seconds. Allow the worker to
    # finish that job and release scratch files before Docker sends SIGKILL.
    stop_grace_period: 32m
    logging: *default-logging

  scheduler:
    image: ${APP_IMAGE:-bbw-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *app-security
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BBW_REDIS_URL: redis://redis:6379/0
      BBW_REDIS_PREFIX: ${BBW_REDIS_PREFIX:-bbw}
      BBW_AI_AGENT_BACKGROUND_ENABLED: "${AI_AGENT_BACKGROUND_ENABLED:-false}"
      BBW_SKIP_DATABASE_CONFIG: "true"
    command: ["python", "-m", "bbw_web.scheduler"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - queue
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 30s
    logging: *default-logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      APP_UPSTREAM: ${APP_UPSTREAM:-app:8000}
      APP_STANDBY_UPSTREAM: ${APP_STANDBY_UPSTREAM:-app-green:8000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${BBW_DATA_ROOT:-/var/lib/bbw}/caddy/data:/data
      - ${BBW_DATA_ROOT:-/var/lib/bbw}/caddy/config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    networks:
      - public
    mem_limit: 96m
    mem_reservation: 48m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:

networks:
  public:
    driver: bridge
  database:
    driver: bridge
    internal: true
  queue:
    driver: bridge
    internal: true
  egress:
    driver: bridge

secrets:
  postgres_password:
    file: ./docker/secrets/postgres_password
  app_master_key:
    file: ./docker/secrets/app_master_key
  credential_keyring:
    file: ./docker/secrets/credential_keyring
  phone_hmac_key:
    file: ./docker/secrets/phone_hmac_key
  session_hmac_key:
    file: ./docker/secrets/session_hmac_key
  txim_secret_key:
    file: ./docker/secrets/txim_secret_key
  roomkit_business_token:
    file: ./docker/secrets/roomkit_business_token
  admin_initial_password:
    file: ./docker/secrets/admin_initial_password
  r2_access_key_id:
    file: ./docker/secrets/r2_access_key_id
  r2_secret_access_key:
    file: ./docker/secrets/r2_secret_access_key
  turnstile_secret_key:
    file: ./docker/secrets/turnstile_secret_key
  deployment_control_token:
    file: ./docker/secrets/deployment_control_token

<!doctype html>
<html lang="zh-CN" class="ui-scrollbar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f5ff" />
  <meta name="color-scheme" content="light" />
  <title>XBLY</title>
  <link rel="stylesheet" href="/static/app.css?v=20260716-mobile-media-retry-secure-viewport-no-text-icons-match-voice-tabs-adaptive-sidebar-message-list-avatar-clean-message-header-message-time-fix-scrollbar-component-csp-avatar-events-message-wide-partial-match-tabs-tim-profile-avatar-zh-ui-partial-social-moments-tabs-feed-fix2-invite-archive-secure-logout-turnstile-message-bootstrap-profile-moments-compact-cards-two-step-login-match-pool-permission-auth-bootstrap-wechat-composer-keyboard-responsive-nav-exclusive-mine-subnav-private-message-policy-moment-video-compat-message-header-compact-list-read-action-h264-fallback-no-original-entry-no-menu-intro-presence-action-mine-partial-tabs-stable-no-duplicate-moments-profile-user-results-optimistic-text-send-match-bottle-tabs-no-commerce-server-membership-nearby-discovery-comment-avatar-profile-hide-default-moment-badges-voice-match-rong-call-match-history-moment-pv-tracking-perf-sync-lazy-cache-message-watchdog-conversation-avatar-stable-reload-conversation-profile-fast-menu-swr-cache-conversation-list-stable-paint-session-bootstrap-retry-route-dom-cache-panel-dom-cache-private-message-policy-recheck-message-dedup-message-quote-message-actions-on-tap" />
</head>
<body>
  <div id="toast" class="toast hide" role="status" aria-live="polite" aria-atomic="true"></div>

  <main id="screen-boot" class="boot-screen" role="status" aria-live="polite" aria-busy="true">
    <div class="boot-status">
      <strong>XBLY</strong>
      <span id="boot-status-text">正在恢复登录状态…</span>
    </div>
  </main>

  <main id="screen-login" class="login-screen hide">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <div>
          <p class="eyebrow" id="login-eyebrow">欢迎回来</p>
          <h1 id="login-title">回到XBLY</h1>
          <p id="login-subtitle">发现新朋友，分享此刻的快乐。</p>
        </div>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div id="login-credentials-step">
          <div class="segmented" id="login-tabs" role="tablist" aria-label="登录方式">
            <button type="button" class="on" role="tab" aria-selected="true" data-mode="password">密码登录</button>
            <button type="button" role="tab" aria-selected="false" data-mode="sms">短信登录</button>
          </div>

          <div class="field">
            <label for="phone">手机号</label>
            <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="username" maxlength="18" placeholder="请输入手机号" required />
          </div>

          <div class="field" id="password-field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入登录密码" />
          </div>

          <div class="field hide" id="sms-field">
            <label for="sms-code">短信验证码</label>
            <div class="input-action">
              <input id="sms-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="请输入验证码" />
              <button type="button" class="btn secondary" id="send-sms">获取验证码</button>
            </div>
          </div>

          <div class="field hide" id="turnstile-field">
            <label>安全验证</label>
            <div id="turnstile-widget"></div>
            <p class="field-help">请完成人机验证后继续登录。</p>
          </div>
        </div>

        <div id="login-invite-step" class="hide">
          <div class="login-step-copy">
            <strong>账号验证成功</strong>
            <p>这是进入前的最后一步，请输入当前有效的邀请码。</p>
          </div>
          <div class="field">
            <label for="invite-code">邀请码</label>
            <input id="invite-code" name="invite_code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64" placeholder="请输入有效邀请码" />
          </div>
        </div>

        <div class="login-actions">
          <button type="button" class="btn secondary hide" id="login-back">返回修改账号</button>
          <button type="submit" class="btn primary full login-submit" id="login-submit">登录</button>
        </div>
        <p id="login-message" class="form-message" role="alert"></p>
      </form>
      <p class="login-note">登录即表示你同意遵守社区礼仪，共同维护友善交流环境。</p>
    </section>
  </main>

  <div id="screen-app" class="app-shell hide">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="side-brand">
        <div>
          <strong>XBLY</strong>
          <span>让相遇更有趣</span>
        </div>
        <button type="button" class="utility-btn side-close mobile-only" id="close-menu">关闭</button>
      </div>

      <div class="side-navigation ui-scrollbar">
        <nav id="primary-nav" class="nav-list nav-tree" aria-label="功能导航"></nav>
        <div class="nav-section hide" id="tools-nav-section">
          <p>调试工具</p>
          <nav id="secondary-nav" class="nav-list secondary-nav" aria-label="调试工具"></nav>
        </div>
      </div>

      <div class="side-account">
        <div class="avatar avatar-sm" id="side-avatar" aria-hidden="true" hidden></div>
        <div class="side-account-copy">
          <strong id="side-name">游客</strong>
          <span id="side-meta">尚未登录</span>
        </div>
        <button type="button" class="utility-btn" id="logout-side">退出</button>
      </div>
    </aside>

    <div class="drawer-mask hide" id="drawer-mask" aria-hidden="true"></div>

    <div class="app-main">
      <header class="topbar">
        <button type="button" class="utility-btn mobile-only" id="open-menu" aria-controls="sidebar" aria-expanded="false">菜单</button>
      </header>

      <main id="page-root" class="page-root" tabindex="-1" aria-live="polite"></main>
    </div>

    <nav id="bottom-nav" class="bottom-nav mobile-only" aria-label="底部主导航"></nav>
  </div>

  <dialog id="profile-dialog" class="profile-dialog" aria-labelledby="profile-dialog-title">
    <div class="profile-dialog-bar">
      <div>
        <strong id="profile-dialog-title">用户资料</strong>
        <span>查看资料会记入双方的访客足迹</span>
      </div>
      <button type="button" class="utility-btn" id="close-profile">关闭</button>
    </div>
    <div id="profile-dialog-body" class="profile-dialog-body ui-scrollbar"></div>
  </dialog>

  <dialog id="voice-call-dialog" class="voice-call-dialog" aria-labelledby="voice-call-title" aria-describedby="voice-call-status">
    <div class="voice-call-dialog-body">
      <span class="voice-call-kicker">一对一语音</span>
      <h2 id="voice-call-title">语音通话</h2>
      <strong id="voice-call-peer">对方</strong>
      <p id="voice-call-status">等待通话状态</p>
      <time id="voice-call-duration" datetime="PT0S">00:00</time>
      <div class="voice-call-actions">
        <button type="button" class="btn primary" data-action="voice-call-accept" hidden>接听</button>
        <button type="button" class="btn soft" data-action="voice-call-reject" hidden>拒绝</button>
        <button type="button" class="btn secondary" data-action="voice-call-mute" aria-pressed="false" hidden>静音</button>
        <button type="button" class="btn danger" data-action="voice-call-hangup" hidden>挂断</button>
      </div>
    </div>
  </dialog>

  <!-- Message services initialize in the background after authentication so unread state is ready on every route. -->
  <script src="/static/app.js?v=20260716-mobile-media-retry-secure-viewport-no-text-icons-match-voice-tabs-adaptive-sidebar-message-list-avatar-clean-message-header-message-time-fix-scrollbar-component-csp-avatar-events-message-wide-partial-match-tabs-tim-profile-avatar-zh-ui-partial-social-moments-tabs-feed-fix2-invite-archive-secure-logout-turnstile-message-bootstrap-profile-moments-compact-cards-two-step-login-match-pool-permission-auth-bootstrap-wechat-composer-keyboard-responsive-nav-exclusive-mine-subnav-private-message-policy-moment-video-compat-message-header-compact-list-read-action-h264-fallback-no-original-entry-no-menu-intro-presence-action-mine-partial-tabs-stable-no-duplicate-moments-profile-user-results-optimistic-text-send-match-bottle-tabs-no-commerce-server-membership-nearby-discovery-comment-avatar-profile-hide-default-moment-badges-voice-match-rong-call-match-history-moment-pv-tracking-perf-sync-lazy-cache-message-watchdog-conversation-avatar-stable-reload-conversation-profile-fast-menu-swr-cache-conversation-list-stable-paint-session-bootstrap-retry-route-dom-cache-panel-dom-cache-private-message-policy-recheck-message-dedup-message-quote-message-actions-on-tap"></script>
</body>
</html>

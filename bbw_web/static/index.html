<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafafa" />
  <title>小贝乐园</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="toast" class="toast hide"></div>

  <!-- LOGIN -->
  <div id="screen-login" class="screen">
    <div class="login-wrap">
      <div class="brand">
        <div class="brand-mark">贝</div>
        <h1>小贝乐园</h1>
        <p>Web 客户端 · 与 App 同一套协议</p>
      </div>
      <div class="login-box">
        <div class="tabs" id="login-tabs">
          <button type="button" class="on" data-m="password">密码</button>
          <button type="button" data-m="onekey">一键</button>
          <button type="button" data-m="sms">短信</button>
        </div>
        <label>手机号</label>
        <input id="phone" type="tel" inputmode="numeric" placeholder="11 位手机号" autocomplete="username" />
        <div id="box-pass">
          <label>密码</label>
          <input id="pass" type="password" placeholder="登录密码" autocomplete="current-password" />
        </div>
        <div id="box-sms" class="hide">
          <label>验证码</label>
          <div class="inline">
            <input id="code" inputmode="numeric" placeholder="短信验证码" />
            <button type="button" class="btn ghost" id="btn-sms">获取</button>
          </div>
        </div>
        <button type="button" class="btn primary full" id="btn-login">登录</button>
        <p class="muted center" id="login-msg"></p>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="screen-app" class="screen hide">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="brand-mark sm">贝</div>
        <div>
          <div class="side-title">小贝乐园</div>
          <div class="side-sub" id="side-sub">—</div>
        </div>
      </div>
      <nav class="side-nav" id="side-nav"></nav>
      <button type="button" class="btn ghost full" id="btn-logout-side">退出</button>
    </aside>

    <div class="main">
      <header class="top">
        <button type="button" class="icon-only mobile-only" id="btn-menu" aria-label="菜单">☰</button>
        <div>
          <div class="top-title" id="page-title">首页</div>
          <div class="top-sub" id="page-sub"></div>
        </div>
        <button type="button" class="icon-only" id="btn-reload" title="刷新">↻</button>
      </header>

      <div class="content" id="content">
        <!-- pages injected / toggled -->
        <section class="page on" data-p="home"></section>
        <section class="page" data-p="square"></section>
        <section class="page" data-p="match"></section>
        <section class="page" data-p="social"></section>
        <section class="page" data-p="room"></section>
        <section class="page" data-p="msg"></section>
        <section class="page" data-p="wallet"></section>
        <section class="page" data-p="tasks"></section>
        <section class="page" data-p="me"></section>
        <section class="page" data-p="lab"></section>
      </div>
    </div>

    <nav class="bottom mobile-only" id="bottom-nav"></nav>
  </div>

  <div id="drawer-mask" class="drawer-mask hide"></div>

  <script src="/static/app.js"></script>
</body>
</html>

bind 0.0.0.0
# Redis is attached only to the Compose `queue` network, which is marked
# internal and publishes no host port.  Protected mode would reject App/RQ
# clients on that private bridge when no Redis password is configured.
protected-mode no
port 6379
tcp-backlog 128
timeout 0
tcp-keepalive 300

databases 4

# Redis contains sessions, rate-limit state and durable RQ metadata.  Refuse
# writes when full rather than silently evicting sessions or queued jobs.
maxmemory 96mb
maxmemory-policy noeviction
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb

save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

loglevel notice

# These destructive/admin commands are not needed by the application.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
